<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ON Radio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e01818">
    <link rel="apple-touch-icon" href="icono-192.png">
    <style>
        :root {
            --rojo: #e01818;
            --rojo2: #c31919;
            --negro: #111111;
            --blanco: #ffffff;
            --verde: #078236;
            --sombra: 0 8px 20px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #170000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* Estilos del Modal de Actualización */
        #modalActualizacion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-contenido {
            background: var(--negro);
            border: 2px solid var(--rojo);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--sombra);
        }
        .modal-contenido h2 {
            color: var(--blanco);
            margin-top: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .modal-contenido p {
            color: #cccccc;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-actualizar {
            background: var(--rojo);
            color: var(--blanco);
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-actualizar:hover {
            background: var(--rojo2);
        }
    </style>
</head>
<body>

    <h1>ON Radio Reproductor</h1>
    <p>Transmitiendo en vivo...</p>

    <!-- Modal de Actualización Obligatoria -->
    <div id="modalActualizacion">
        <div class="modal-contenido">
            <h2>¡NUEVA ACTUALIZACIÓN!</h2>
            <p>Nos renovamos. Actualiza ahora y mantén la app siempre en la última versión.</p>
            <button class="btn-actualizar" onclick="ejecutarActualizacionApp()">ACTUALIZAR AHORA</button>
        </div>
    </div>

    <script>
        // Versión estricta de la aplicación (cambiar solo ante modificaciones de código o estructura)
        const VERSION_CODIGO_APP = "2026.09.21-v3";

        // Funciones de ayuda simuladas para el entorno publicitario
        function getAdConfig() {
            // Lee la configuración guardada o devuelve valores por defecto
            const guardado = localStorage.getItem("on_radio_ad_config");
            return guardado ? JSON.parse(guardado) : { enabled: false, adsList: [], duration: 5 };
        }

        function minutosDelDia() {
            const ahora = new Date();
            return ahora.getHours() * 60 + ahora.getMinutes();
        }

        function horaAMinutos(horaStr) {
            const partes = horaStr.split(":");
            return parseInt(partes[0]) * 60 + parseInt(partes[1]);
        }

        function iniciarPopupPublicidad(opciones) {
            console.log("Iniciando publicidad con opciones:", opciones);
        }

        // Verificador de actualización automática optimizado
        window.addEventListener("DOMContentLoaded", () => {
            const versionGuardada = localStorage.getItem("on_radio_codigo_version");

            if (!versionGuardada) {
                localStorage.setItem("on_radio_codigo_version", VERSION_CODIGO_APP);
            } else if (versionGuardada !== VERSION_CODIGO_APP) {
                // Muestra el modal limpio si hay nueva versión de código
                document.getElementById("modalActualizacion").style.display = "flex";
                return;
            }

            // Carga y despliegue del Pop-up Publicitario Dinámico
            const config = getAdConfig();
            if (config.enabled && config.adsList && config.adsList.length > 0) {
                const ahoraMins = minutosDelDia();
                const adsFiltradas = config.adsList.filter(ad => {
                    if (!ad.imagen || ad.imagen.trim() === "") return false;
                    if (ad.todoElDia) return true;
                    const inicioMins = horaAMinutos(ad.horaInicio || "00:00");
                    const finMins = horaAMinutos(ad.horaFin || "23:59");
                    if (inicioMins <= finMins) {
                        return ahoraMins >= inicioMins && ahoraMins <= finMins;
                    } else {
                        return ahoraMins >= inicioMins || ahoraMins <= finMins;
                    }
                });

                if (adsFiltradas.length > 0) {
                    iniciarPopupPublicidad({
                        duration: config.duration,
                        images: adsFiltradas.map(a => a.imagen)
                    });
                }
            }
        });

        // Función para actualizar limpiando caché
        function ejecutarActualizacionApp() {
            localStorage.setItem("on_radio_codigo_version", VERSION_CODIGO_APP);
            window.location.reload(true);
        }

        // Función para guardar configuración de anuncios sin disparar el modal de la app
        function saveAdConfig(config) {
            try {
                localStorage.setItem("on_radio_ad_config", JSON.stringify(config));
                return true;
            } catch (e) {
                console.error("Error al guardar en localStorage:", e);
                alert("¡Atención! Las imágenes son demasiado pesadas para la memoria interna.");
                return false;
            }
        }
    </script>
</body>
</html>
